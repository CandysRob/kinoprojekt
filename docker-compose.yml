services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      # Konteinerite võrgus on andmebaas teenuse nime all
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Dockeris on vahemälu Redises, ilma Dockerita failides (config/settings.py)
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      # Windowsi/macOS-i kaardistatud kaustas on failimuudatuste nägemiseks vaja pollingut
      WATCH_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  # pgbench load tests (docs/testing/pgbench.md). Starts only on request:
  #   docker compose run --rm pgbench <scenario>
  # Uses a separate database, so the development data is not touched.
  pgbench:
    image: postgres:16
    profiles: ["bench"]
    entrypoint: ["sh", "/bench/run.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${BENCH_DB:-kinoprojekt_bench}
    volumes:
      - ./bench:/bench:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
